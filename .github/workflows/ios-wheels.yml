# Fork doctoralvarez/Nyxian — version 1.0.0
# Changelog:
#  - 1.0.0 (2026-11-08): builds iOS wheels (CPython 3.14, arm64 iphoneos)
#    of packages that have none on PyPI or BeeWare's index (matplotlib) and
#    publishes them on the "ios-wheels" release, where Nyxian's pip looks.
name: iOS wheels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages (pip specs, space separated)"
        default: "matplotlib"
  push:
    branches: [mejoras-editor-ipad]
    paths:
      - .github/workflows/ios-wheels.yml
      - tools/fork/ios-wheels/**

permissions:
  contents: write

concurrency:
  group: ios-wheels
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PACKAGES: ${{ github.event.inputs.packages || 'matplotlib' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Tools
        run: |
          python -m pip install --upgrade pip cibuildwheel
          cibuildwheel --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build
        env:
          CIBW_PLATFORM: ios
          CIBW_ARCHS_IOS: arm64_iphoneos
          CIBW_BUILD: cp314-*
          CIBW_TEST_SKIP: "*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT_IOS: PIP_EXTRA_INDEX_URL=https://pypi.anaconda.org/beeware/simple PIP_PREFER_BINARY=1
          PIP_EXTRA_INDEX_URL: https://pypi.anaconda.org/beeware/simple
        run: |
          mkdir -p wheelhouse src
          for spec in $PACKAGES; do
            rm -rf src/* && pip download --no-deps --no-binary :all: -d src "$spec"
            archive=$(ls src/*)
            echo "::group::$spec ($archive)"
            mkdir -p src/x && tar -xf "$archive" -C src/x
            project=$(ls -d src/x/*/ | head -1)
            cibuildwheel --output-dir wheelhouse "$project"
            echo "::endgroup::"
          done
          ls -la wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: ios-wheels
          path: wheelhouse/*.whl

      - name: Publish on the ios-wheels release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-wheels -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ios-wheels -R "$GITHUB_REPOSITORY" --title "iOS wheels for Nyxian's Python" \
              --notes "Wheels for CPython 3.14 on iOS (arm64 device) that PyPI and BeeWare's index lack. Nyxian's pip finds them here." --prerelease
          gh release upload ios-wheels wheelhouse/*.whl -R "$GITHUB_REPOSITORY" --clobber
