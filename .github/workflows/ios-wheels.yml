# Fork doctoralvarez/Nyxian — version 1.6.1
# Changelog:
#  - 1.6.1 (2026-11-19): input "rebuild" builds again even if an iOS wheel
#    exists; every wheel built here gets its binaries signed ad-hoc
#    (sign_wheel.sh): Nyxian refused an unsigned .so ("missing code signature").
#  - 1.6.0 (2026-11-19): C and C++ libraries for iOS (tools/fork/ios-wheels/
#    native.sh): "native:<name or URL>" in the package list (or the new
#    "native" input) builds a library alone and publishes it on the
#    "ios-native" release; a Python package that links one (tesserocr:
#    Leptonica + Tesseract) gets it built or downloaded first, statically
#    linked into its wheel.
#  - 1.5.1 (2026-11-18): a universal wheel whose code does not compile on
#    Python 3 (an old Python 2 package) is no longer published.
#  - 1.5.0 (2026-11-18): a pure-Python package that only has a source package
#    gets its universal wheel published (pip cannot build it on iOS); your
#    Mac counts as available while it is busy with another build.
#  - 1.4.0 (2026-11-18): your own Mac first (the self-hosted runner, when the
#    variable NYXIAN_RUNNER is "self-hosted" and RUNNER_STATUS_TOKEN sees it
#    online), else GitHub's Mac; Homebrew's Python 3.14 when setup-python
#    cannot install it there. Nyxian starts it when pip finds no iOS wheel and
#    you approve (Settings › Toolchain › iOS Wheels).
#  - 1.3.0 (2026-11-08): also looks in Flet's index of mobile wheels
#    (pypi.flet.dev: scipy 1.18 for iOS, …); wheels found elsewhere are copied
#    onto this release; default: scipy scikit-learn pandas.
#  - 1.2.0 (2026-11-08): meson builds that import numpy for its headers
#    (pandas) find them without importing it (patch_numpy_include.py);
#    default package: pandas (scipy needs a Fortran compiler for iOS).
#  - 1.1.0 (2026-11-08): several packages per run (default: pandas scipy);
#    a package that already has an iOS wheel for CPython 3.14 (PyPI, BeeWare,
#    this release) is skipped; one that fails does not stop the others; per
#    package settings (scipy: Accelerate for BLAS/LAPACK); summary at the end.
#  - 1.0.1 (2026-11-08): the Mac's ninja runs the build (xbuild-tools).
#  - 1.0.0 (2026-11-08): builds iOS wheels (CPython 3.14, arm64 iphoneos)
#    of packages that have none on PyPI or BeeWare's index (matplotlib) and
#    publishes them on the "ios-wheels" release, where Nyxian's pip looks.
name: iOS wheels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages (pip specs, space separated)"
        default: "scipy scikit-learn pandas"
      native:
        description: "C/C++ libraries for iOS alone (recipe names like leptonica tesseract, or source URLs)"
        default: ""
        required: false
      rebuild:
        description: "Build again even if an iOS wheel already exists (replaces the one on this release)"
        type: boolean
        default: false
  push:
    branches: [mejoras-editor-ipad]
    paths:
      - .github/workflows/ios-wheels.yml
      - tools/fork/ios-wheels/**

permissions:
  contents: write
  actions: read

concurrency:
  group: ios-wheels
  cancel-in-progress: false

jobs:
  # your Mac if it is online, else GitHub's (same rule as the app build)
  pick-runner:
    name: Pick the Mac
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - id: pick
        env:
          WANT: ${{ vars.NYXIAN_RUNNER }}
          STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          choice='"macos-15"'
          if [ "$WANT" = "self-hosted" ]; then
            if [ -z "$STATUS_TOKEN" ]; then
              choice='["self-hosted","macOS","ARM64"]'
            else
              # a runner that just took or finished a job can look offline for a moment: ask up to 3 times
              for attempt in 1 2 3; do
                online=$(curl -fsS -H "Authorization: Bearer $STATUS_TOKEN" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/actions/runners?per_page=100" \
                  | jq '[.runners[] | select(.status == "online" or .busy == true) | select([.labels[].name] | index("self-hosted"))] | length' || echo "error")
                if [ "$online" = "error" ] || [ "$online" -gt 0 ]; then break; fi
                sleep 10
              done
              # busy with another build (the runners list can show it as offline then): still yours
              if [ "$online" != "error" ] && [ "$online" -eq 0 ]; then
                busy=0
                for id in $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs?status=in_progress&per_page=20" | jq -r '.workflow_runs[].id' 2>/dev/null); do
                  n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$id/jobs" | jq '[.jobs[] | select(.status == "in_progress") | select(.labels | index("self-hosted"))] | length' 2>/dev/null || echo 0)
                  busy=$((busy + n))
                done
                if [ "$busy" -gt 0 ]; then echo "Your Mac is busy with another build: this one waits for it"; online=1; fi
              fi
              if [ "$online" = "error" ] || [ "$online" -gt 0 ]; then
                choice='["self-hosted","macOS","ARM64"]'
              else
                echo "::notice::Your Mac is off or asleep: GitHub's Mac builds the wheels"
              fi
            fi
          fi
          echo "runs_on=$choice" >> "$GITHUB_OUTPUT"
          echo "Builds on: $choice"

  build:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs_on) }}
    timeout-minutes: 240
    env:
      PACKAGES: ${{ github.event.inputs.packages || 'scipy scikit-learn pandas joblib threadpoolctl' }}
      NATIVE: ${{ github.event.inputs.native || '' }}
      REBUILD: ${{ github.event.inputs.rebuild || 'false' }}
      FIND_LINKS: https://github.com/${{ github.repository }}/releases/expanded_assets/ios-wheels
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup-python
        # your Mac has no tool cache under /Users/runner: then Homebrew's (below)
        continue-on-error: true
        with:
          python-version: '3.14'

      - name: Python 3.14 from Homebrew
        if: steps.setup-python.outcome != 'success'
        run: |
          brew install python@3.14
          "$(brew --prefix python@3.14)/bin/python3.14" -m venv "$RUNNER_TEMP/python314"
          echo "$RUNNER_TEMP/python314/bin" >> "$GITHUB_PATH"

      - name: Tools
        run: |
          python -m pip install --upgrade pip cibuildwheel wheel
          python -m pip show cibuildwheel | head -2
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          command -v cmake >/dev/null || brew install cmake
          for t in autoconf automake libtool; do command -v $t >/dev/null || brew list $t >/dev/null 2>&1 || brew install $t; done
          cmake --version | head -1
          ninja --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build
        env:
          CIBW_PLATFORM: ios
          CIBW_ARCHS_IOS: arm64_iphoneos
          CIBW_BUILD: cp314-*
          CIBW_TEST_SKIP: "*"
          CIBW_BUILD_VERBOSITY: 1
          # build tools of the Mac that may run during the iOS build (else pip tries to build them for iOS)
          CIBW_XBUILD_TOOLS_IOS: "ninja pkg-config"
          PIP_EXTRA_INDEX_URL: https://pypi.anaconda.org/beeware/simple
          GH_TOKEN: ${{ github.token }}
          IOS_NATIVE_DIST: ${{ github.workspace }}/native-dist
        run: |
          mkdir -p wheelhouse src native-dist
          : > summary.txt
          native=tools/fork/ios-wheels/native.sh
          # C/C++ libraries on their own: the "native" input, or "native:<lib>" among the packages
          items=""
          for lib in $NATIVE; do items="$items native:$lib"; done
          for spec in $items $PACKAGES; do
            echo "::group::$spec"
            if [ "${spec#native:}" != "$spec" ]; then
              lib="${spec#native:}"
              if bash "$native" ensure "$lib"; then
                echo "$lib: C/C++ library for iOS ready (ios-native release)" | tee -a summary.txt
              else
                echo "$lib: C/C++ library FAILED to build for iOS (see its log group)" | tee -a summary.txt
              fi
              echo "::endgroup::"; continue
            fi
            name="${spec%%[<>=!~ ]*}"
            # already there? (PyPI, BeeWare's index, this release)
            # already built somewhere? (PyPI, BeeWare, Flet's mobile index, this release):
            # a copy goes on this release too, so Nyxian does not depend on the others
            rm -rf mirror && mkdir -p mirror
            if [ "$REBUILD" != "true" ] && python -m pip download --quiet --no-deps --only-binary :all: -d mirror \
                 --platform ios_13_0_arm64_iphoneos --python-version 3.14 --implementation cp --abi cp314 \
                 --extra-index-url https://pypi.anaconda.org/beeware/simple --extra-index-url https://pypi.flet.dev \
                 --find-links "$FIND_LINKS" "$spec"; then
              cp mirror/*.whl wheelhouse/ 2>/dev/null || true
              echo "$spec: iOS wheel found, copied: $(ls mirror)" | tee -a summary.txt
              echo "::endgroup::"; continue
            fi
            rm -rf src/* && mkdir -p src/x
            if ! python -m pip download --no-deps --no-binary :all: -d src "$spec"; then
              echo "$spec: no source package" | tee -a summary.txt; echo "::endgroup::"; continue
            fi
            archive=$( (ls src/*.tar.gz src/*.zip 2>/dev/null || true) | head -1)
            case "$archive" in *.zip) unzip -q "$archive" -d src/x ;; *) tar -xf "$archive" -C src/x ;; esac
            project=$(ls -d src/x/*/ | head -1)
            # meson builds that import numpy for its headers (pandas…): found without importing it
            python tools/fork/ios-wheels/patch_numpy_include.py "$project"
            # settings per package
            unset CIBW_CONFIG_SETTINGS_IOS
            export CIBW_ENVIRONMENT_IOS="PIP_EXTRA_INDEX_URL='https://pypi.anaconda.org/beeware/simple https://pypi.flet.dev' PIP_PREFER_BINARY=1 PIP_FIND_LINKS=$FIND_LINKS"
            # C/C++ libraries it links (tesserocr: Leptonica + Tesseract), built for iOS first
            deps=$(bash "$native" deps "$name")
            if [ -n "$deps" ]; then
              if bash "$native" ensure $deps; then
                export CIBW_ENVIRONMENT_IOS="$CIBW_ENVIRONMENT_IOS $(bash "$native" env)"
                echo "$spec: uses C/C++ libraries for iOS: $deps"
              else
                echo "$spec: FAILED, its C/C++ libraries ($deps) did not build for iOS" | tee -a summary.txt
                echo "::endgroup::"; continue
              fi
            fi
            case "$name" in
              # scipy also needs a Fortran compiler for iOS, which the runners do not have
              scipy) export CIBW_CONFIG_SETTINGS_IOS="setup-args=-Dblas=accelerate setup-args=-Dlapack=accelerate" ;;
            esac
            # pure Python with only a source package (pip cannot build it on iOS: no processes):
            # the universal wheel is what Nyxian needs
            rm -rf purecheck && mkdir -p purecheck
            if python -m pip wheel --quiet --no-deps --no-build-isolation -w purecheck "$project" 2>/dev/null \
               || python -m pip wheel --quiet --no-deps -w purecheck "$project"; then
              pure=$(ls purecheck/*-none-any.whl 2>/dev/null | head -1)
              if [ -n "$pure" ]; then
                # an old Python 2-only package (print '...') builds a wheel but cannot run
                rm -rf purecheck/x && mkdir -p purecheck/x
                python -m zipfile -e "$pure" purecheck/x
                if ! python -m compileall -q purecheck/x >purecheck/compile.log 2>&1; then
                  echo "$spec: not Python 3 code (does not compile), not published" | tee -a summary.txt
                  head -5 purecheck/compile.log
                  echo "::endgroup::"; continue
                fi
                cp "$pure" wheelhouse/
                echo "$spec: pure Python, universal wheel $(basename "$pure")" | tee -a summary.txt
                echo "::endgroup::"; continue
              fi
            fi
            rm -rf built && mkdir -p built
            if cibuildwheel --output-dir built "$project"; then
              bash tools/fork/ios-wheels/sign_wheel.sh built/*.whl
              echo "$spec: built $(cd built && ls *.whl | tr '\n' ' ')" | tee -a summary.txt
              mv built/*.whl wheelhouse/
            else
              echo "$spec: FAILED to build (see its log group)" | tee -a summary.txt
            fi
            echo "::endgroup::"
          done
          echo "---- summary"; cat summary.txt
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          ls -la wheelhouse

      - uses: actions/upload-artifact@v4
        if: hashFiles('native-dist/*.tar.gz') != ''
        with:
          name: ios-native
          path: native-dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        if: hashFiles('wheelhouse/*.whl') != ''
        with:
          name: ios-wheels
          path: wheelhouse/*.whl

      - name: Publish on the ios-wheels release
        if: hashFiles('wheelhouse/*.whl') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-wheels -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ios-wheels -R "$GITHUB_REPOSITORY" --title "iOS wheels for Nyxian's Python" \
              --notes "Wheels for CPython 3.14 on iOS (arm64 device) that PyPI and BeeWare's index lack. Nyxian's pip finds them here." --prerelease
          gh release upload ios-wheels wheelhouse/*.whl -R "$GITHUB_REPOSITORY" --clobber
