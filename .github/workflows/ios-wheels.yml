# Fork doctoralvarez/Nyxian — version 1.2.0
# Changelog:
#  - 1.2.0 (2026-11-08): meson builds that import numpy for its headers
#    (pandas) find them without importing it (patch_numpy_include.py);
#    default package: pandas (scipy needs a Fortran compiler for iOS).
#  - 1.1.0 (2026-11-08): several packages per run (default: pandas scipy);
#    a package that already has an iOS wheel for CPython 3.14 (PyPI, BeeWare,
#    this release) is skipped; one that fails does not stop the others; per
#    package settings (scipy: Accelerate for BLAS/LAPACK); summary at the end.
#  - 1.0.1 (2026-11-08): the Mac's ninja runs the build (xbuild-tools).
#  - 1.0.0 (2026-11-08): builds iOS wheels (CPython 3.14, arm64 iphoneos)
#    of packages that have none on PyPI or BeeWare's index (matplotlib) and
#    publishes them on the "ios-wheels" release, where Nyxian's pip looks.
name: iOS wheels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages (pip specs, space separated)"
        default: "pandas"
  push:
    branches: [mejoras-editor-ipad]
    paths:
      - .github/workflows/ios-wheels.yml
      - tools/fork/ios-wheels/**

permissions:
  contents: write

concurrency:
  group: ios-wheels
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      PACKAGES: ${{ github.event.inputs.packages || 'pandas' }}
      FIND_LINKS: https://github.com/${{ github.repository }}/releases/expanded_assets/ios-wheels
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Tools
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m pip show cibuildwheel | head -2
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          ninja --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build
        env:
          CIBW_PLATFORM: ios
          CIBW_ARCHS_IOS: arm64_iphoneos
          CIBW_BUILD: cp314-*
          CIBW_TEST_SKIP: "*"
          CIBW_BUILD_VERBOSITY: 1
          # build tools of the Mac that may run during the iOS build (else pip tries to build them for iOS)
          CIBW_XBUILD_TOOLS_IOS: "ninja pkg-config"
          PIP_EXTRA_INDEX_URL: https://pypi.anaconda.org/beeware/simple
        run: |
          mkdir -p wheelhouse src
          : > summary.txt
          for spec in $PACKAGES; do
            echo "::group::$spec"
            name="${spec%%[<>=!~ ]*}"
            # already there? (PyPI, BeeWare's index, this release)
            if python -m pip download --quiet --no-deps --only-binary :all: -d /tmp/existing \
                 --platform ios_13_0_arm64_iphoneos --python-version 3.14 --implementation cp --abi cp314 \
                 --extra-index-url https://pypi.anaconda.org/beeware/simple --find-links "$FIND_LINKS" "$spec" 2>/dev/null; then
              echo "$spec: an iOS wheel already exists, skipped" | tee -a summary.txt
              echo "::endgroup::"; continue
            fi
            rm -rf src/* && mkdir -p src/x
            if ! python -m pip download --no-deps --no-binary :all: -d src "$spec"; then
              echo "$spec: no source package" | tee -a summary.txt; echo "::endgroup::"; continue
            fi
            archive=$( (ls src/*.tar.gz src/*.zip 2>/dev/null || true) | head -1)
            case "$archive" in *.zip) unzip -q "$archive" -d src/x ;; *) tar -xf "$archive" -C src/x ;; esac
            project=$(ls -d src/x/*/ | head -1)
            # meson builds that import numpy for its headers (pandas…): found without importing it
            python tools/fork/ios-wheels/patch_numpy_include.py "$project"
            # settings per package
            unset CIBW_CONFIG_SETTINGS_IOS
            export CIBW_ENVIRONMENT_IOS="PIP_EXTRA_INDEX_URL=https://pypi.anaconda.org/beeware/simple PIP_PREFER_BINARY=1 PIP_FIND_LINKS=$FIND_LINKS"
            case "$name" in
              # scipy also needs a Fortran compiler for iOS, which the runners do not have
              scipy) export CIBW_CONFIG_SETTINGS_IOS="setup-args=-Dblas=accelerate setup-args=-Dlapack=accelerate" ;;
            esac
            if cibuildwheel --output-dir wheelhouse "$project"; then
              echo "$spec: built $(ls -t wheelhouse | head -1)" | tee -a summary.txt
            else
              echo "$spec: FAILED to build (see its log group)" | tee -a summary.txt
            fi
            echo "::endgroup::"
          done
          echo "---- summary"; cat summary.txt
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          ls -la wheelhouse

      - uses: actions/upload-artifact@v4
        if: hashFiles('wheelhouse/*.whl') != ''
        with:
          name: ios-wheels
          path: wheelhouse/*.whl

      - name: Publish on the ios-wheels release
        if: hashFiles('wheelhouse/*.whl') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-wheels -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ios-wheels -R "$GITHUB_REPOSITORY" --title "iOS wheels for Nyxian's Python" \
              --notes "Wheels for CPython 3.14 on iOS (arm64 device) that PyPI and BeeWare's index lack. Nyxian's pip finds them here." --prerelease
          gh release upload ios-wheels wheelhouse/*.whl -R "$GITHUB_REPOSITORY" --clobber
