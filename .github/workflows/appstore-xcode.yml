# fork doctoralvarez/Nyxian — version 1.6.0
# Changelog:
#  - 1.6.0 (2026-11-23): the export signs MANUALLY with an Apple Distribution
#    certificate and App Store profiles made for this upload through the App
#    Store Connect API (tools/fork/appstore/api_signing.rb), removed again at
#    the end. Xcode's automatic signing with the key failed at export too
#    ("exportArchive Authentication failed" / "No profiles"), while the API
#    creates them fine. aps-environment is set to production for the export.
#  - 1.5.0 (2026-11-23): upload archives UNSIGNED and signs the archive
#    locally without a certificate (codesign -s -) with each target's
#    entitlements; the export then signs for the App Store with the key.
#    Archiving signed made Xcode create iOS App Development profiles with the
#    API key, which Apple refuses ("Authentication failed ... bearer token"
#    and "No profiles ... iOS App Development"); the export does not need
#    them. Fixes uploads failing for every app since 2026-11-23.
#  - 1.4.0 (2026-11-23): request IDs "selftest-sign-<TEAMID>-..." build the
#    probe SIGNED (archive with the key, as a real upload) for that team, to
#    tell whether a signing failure is about one app or about the account.
#  - 1.3.1 (2026-11-23): the key check also asks for bundle IDs, certificates
#    and profiles (what Xcode needs to sign) and prints each answer.
#  - 1.3.0 (2026-11-23): new step "Check the App Store Connect key" before
#    archiving (mode upload): trims spaces / line breaks from ASC_KEY_ID and
#    ASC_ISSUER_ID, rebuilds ASC_KEY_P8 when it was pasted on one line (as the
#    GitHub app on iPhone tends to do), and asks App Store Connect itself
#    whether the key works. When it does not, it stops with a plain error
#    (shown in Last Upload) instead of Xcode's "Authentication failed".
#  - 1.2.0 (2026-11-23): the Xcode project is made inside the request folder
#    (make_project.py 1.1.0: no "../" paths, which had left every source out),
#    and the archive step fails with a plain message when the archive has no
#    executable instead of passing empty ("nothing that can be signed").
#  - 1.1.0 (2026-11-23): the result carries Xcode's own lines on how it went
#    (** ARCHIVE SUCCEEDED **, ** EXPORT FAILED **, Upload succeeded…) as
#    "summary", shown in Nyxian's Last Upload.
#  - 1.0.0 (2026-11-22): the last step to the App Store, done by Apple's Xcode
#    on a Mac: your own Mac when it is online, GitHub's otherwise (the same
#    choice as "Build iOS App"). Nyxian (Settings › App Store Connect › Xcode
#    on Mac) puts <request>.zip — the app's project, the projects of the
#    extensions its Export embeds and manifest.json — on the private
#    repository's "appstore-requests" release and starts this workflow.
#    XcodeGen makes an Xcode project of them, xcodebuild archives it with
#    automatic signing and your App Store Connect API key, and exportArchive
#    uploads it to App Store Connect (mode "upload"), or only archives it
#    without signing (mode "check"). The build is Xcode's own: its DTXcode /
#    DTSDKBuild, Assets.car, Metadata.appintents and privacy report are real.
#
#    Your app's code never shows here: it comes from and goes back to the
#    private repository, the log of xcodebuild and the result
#    (<request>-log.txt, <request>-result.json) go there too, and this log
#    only says which step ran.
#
#    A request ID starting with "selftest-" builds tools/fork/widget-probe (generic
#    code in this repository) in mode check and prints its result here instead.
#
#    Secrets (Settings › Secrets and variables › Actions of this repository):
#      SDK_REPO_TOKEN      the private repository (already there for builds)
#      ASC_KEY_ID          App Store Connect API key ID
#      ASC_ISSUER_ID       its Issuer ID
#      ASC_KEY_P8          the text of AuthKey_<Key ID>.p8 (role Admin)
#      APPLE_TEAM_ID       your Team ID (10 characters), if Nyxian does not send it

name: App Store (Xcode)

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Request ID (<request>.zip on the private appstore-requests release)"
        required: true
      mode:
        description: "upload (archive, sign, upload) or check (archive without signing)"
        required: false
        default: "upload"

permissions:
  contents: read

concurrency:
  group: appstore-xcode-${{ github.event.inputs.request }}

jobs:
  pick-runner:
    name: Pick the Mac
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - id: pick
        env:
          WANT: ${{ vars.NYXIAN_RUNNER }}
          STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          github_mac='"xcode-27"'
          if [ "$WANT" = "macos-latest" ]; then github_mac='"macos-latest"'; fi
          own_mac='["self-hosted","macOS","ARM64"]'
          choice="$github_mac"
          if [ "$WANT" = "self-hosted" ]; then
            if [ -z "$STATUS_TOKEN" ]; then
              echo "No RUNNER_STATUS_TOKEN: using your Mac (waits if it is off)"
              choice="$own_mac"
            else
              for attempt in 1 2 3; do
                online=$(curl -fsS -H "Authorization: Bearer $STATUS_TOKEN" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/actions/runners?per_page=100" \
                  | jq '[.runners[] | select(.status == "online" or .busy == true) | select([.labels[].name] | index("self-hosted"))] | length' || echo "error")
                if [ "$online" = "error" ] || [ "$online" -gt 0 ]; then break; fi
                sleep 10
              done
              if [ "$online" != "error" ] && [ "$online" -eq 0 ]; then
                busy=0
                for id in $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs?status=in_progress&per_page=20" | jq -r '.workflow_runs[].id' 2>/dev/null); do
                  n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$id/jobs" | jq '[.jobs[] | select(.status == "in_progress") | select(.labels | index("self-hosted"))] | length' 2>/dev/null || echo 0)
                  busy=$((busy + n))
                done
                if [ "$busy" -gt 0 ]; then echo "Your Mac is busy with another job: this one waits for it"; online=1; fi
              fi
              if [ "$online" = "error" ]; then
                echo "::warning::Could not read your runners (check RUNNER_STATUS_TOKEN): using your Mac"
                choice="$own_mac"
              elif [ "$online" -gt 0 ]; then
                echo "Your Mac is online: it builds"
                choice="$own_mac"
              else
                echo "::notice::Your Mac is off or asleep: GitHub's Mac builds this one"
              fi
            fi
          fi
          echo "runs_on=$choice" >> "$GITHUB_OUTPUT"
          echo "Builds on: $choice"

  xcode:
    name: Xcode
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs_on) }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
      SDK_REPO: doctoralvarez/nyxian-sdk
      RELEASE: appstore-requests
      REQUEST: ${{ github.event.inputs.request }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - name: Check the request
        run: |
          if ! printf '%s' "$REQUEST" | grep -Eq '^[A-Za-z0-9-]{8,64}$'; then echo "::error::Bad request ID"; exit 1; fi
          case "$MODE" in upload|check) ;; *) echo "::error::Mode must be upload or check"; exit 1 ;; esac
          if [ -z "$GH_TOKEN" ]; then echo "::error::The secret SDK_REPO_TOKEN is missing"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          path: nyxian
          sparse-checkout: |
            tools/fork/appstore
            tools/fork/widget-probe

      - name: Get the projects (private repository)
        run: |
          WORK="$RUNNER_TEMP/appstore-$REQUEST"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          rm -rf "$WORK"; mkdir -p "$WORK/request" "$WORK/out"
          case "$REQUEST" in selftest-*)
            mkdir -p "$WORK/request/ProbeApp/Config" "$WORK/request/ProbeWidget/Config"
            cp nyxian/tools/fork/widget-probe/App/*.swift "$WORK/request/ProbeApp/"
            cp nyxian/tools/fork/widget-probe/Widget/*.swift "$WORK/request/ProbeWidget/"
            cp nyxian/tools/fork/appstore/selftest-manifest.json "$WORK/request/manifest.json"
            case "$REQUEST" in
              selftest-sign-*)
                # signed probe for the team in the request ID (selftest-sign-TEAMID-...)
                TEAM=$(printf '%s' "$REQUEST" | cut -d- -f3)
                python3 - "$WORK/request/manifest.json" "$TEAM" <<'PY'
          import json, sys
          p, team = sys.argv[1], sys.argv[2]
          m = json.load(open(p)); m["teamID"] = team
          m["app"]["entitlements"].pop("get-task-allow", None)
          json.dump(m, open(p, "w"))
          PY
                echo "Self-test request (signed, team $TEAM)" ;;
              *)
                echo "MODE=check" >> "$GITHUB_ENV"
                echo "Self-test request" ;;
            esac
            exit 0 ;;
          esac
          gh release download "$RELEASE" -R "$SDK_REPO" -p "$REQUEST.zip" -D "$WORK" >/dev/null
          ditto -x -k "$WORK/$REQUEST.zip" "$WORK/request"
          test -f "$WORK/request/manifest.json"
          echo "Request unpacked"

      - name: Make the Xcode project
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          printf '{"ok":false,"stage":"project"}' > "$WORK/out/result.json"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen >/dev/null 2>&1
          python3 nyxian/tools/fork/appstore/make_project.py "$WORK/request" "$WORK/request" > "$WORK/scheme.txt" 2> "$WORK/out/log.txt"
          (cd "$WORK/request" && xcodegen generate --spec project.yml) >> "$WORK/out/log.txt" 2>&1
          echo "Xcode project ready"

      - name: Check the App Store Connect key
        if: github.event.inputs.mode != 'check'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '{"ok":false,"stage":"key"}' > "$WORK/out/result.json"
          KID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISS=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          if [ -z "$KID" ] || [ -z "$ISS" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "error: Missing secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8" >> "$WORK/out/log.txt"; exit 1
          fi
          echo "::add-mask::$KID"; echo "::add-mask::$ISS"
          mkdir -p "$WORK/key"; chmod 700 "$WORK/key"
          # the key's base64 body, whatever line breaks or spaces it was pasted with
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d '[:space:]')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$WORK/key/AuthKey_$KID.p8"
          echo "ASC_KID=$KID" >> "$GITHUB_ENV"
          echo "ASC_ISS=$ISS" >> "$GITHUB_ENV"
          if ! command -v ruby >/dev/null 2>&1; then
            echo "warning: ruby not found on this Mac; key not checked" >> "$WORK/out/log.txt"; echo "Key not checked"; exit 0
          fi
          KEYFILE="$WORK/key/AuthKey_$KID.p8" KID="$KID" ISS="$ISS" ruby -ropenssl -rjson -rbase64 -rnet/http -e '
            def b64(s) = Base64.urlsafe_encode64(s, padding: false)
            log = ->(m) { File.open(ENV["WORK"] + "/out/log.txt", "a") { |f| f.puts m } }
            kid = ENV["KID"]; iss = ENV["ISS"]
            log.("Key check: Key ID #{kid.length} characters (" + (kid =~ /\A[A-Z0-9]{10}\z/ ? "ok" : "expected 10 letters/digits") + "), Issuer ID " + (iss =~ /\A\h{8}-\h{4}-\h{4}-\h{4}-\h{12}\z/ ? "ok" : "not a UUID (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)"))
            begin
              key = OpenSSL::PKey.read(File.read(ENV["KEYFILE"]))
            rescue => e
              log.("error: App Store Connect key: ASC_KEY_P8 is not a readable .p8 key (#{e.class}). Paste the whole AuthKey_#{kid}.p8 again.")
              exit 1
            end
            now = Time.now.to_i
            input = b64({alg: "ES256", kid: kid, typ: "JWT"}.to_json) + "." + b64({iss: iss, iat: now, exp: now + 600, aud: "appstoreconnect-v1"}.to_json)
            der = key.sign(OpenSSL::Digest::SHA256.new, input)
            rs = OpenSSL::ASN1.decode(der).value.map { |i| i.value.to_s(2).rjust(32, "\0")[-32..] }.join
            jwt = input + "." + b64(rs)
            # the same kinds of things Xcode needs to sign: apps, bundle IDs, certificates, profiles
            ["apps", "bundleIds", "certificates", "profiles"].each do |what|
              uri = URI("https://api.appstoreconnect.apple.com/v1/#{what}?limit=1")
              req = Net::HTTP::Get.new(uri); req["Authorization"] = "Bearer " + jwt
              begin
                res = Net::HTTP.start(uri.host, uri.port, use_ssl: true, open_timeout: 15, read_timeout: 20) { |h| h.request(req) }
              rescue => e
                log.("warning: could not reach App Store Connect to check the key (#{e.class}); going on")
                exit 0
              end
              if res.code == "200"
                log.("Key check: #{what} HTTP 200"); puts "Key check: #{what} HTTP 200"
              else
                detail = (JSON.parse(res.body)["errors"] || []).map { |x| [x["code"], x["detail"] || x["title"]].compact.join(": ") }.join(" | ") rescue res.body.to_s[0, 300]
                log.("error: App Store Connect rejects the key for #{what} (HTTP #{res.code}): #{detail}")
                puts "Key check: #{what} HTTP #{res.code}: #{detail}"
                exit 1
              end
            end
          '
          echo "Key checked"

      - name: Profile test (selftest-prof only)
        if: startsWith(github.event.inputs.request, 'selftest-prof-')
        run: |
          KEYFILE="$WORK/key/AuthKey_$ASC_KID.p8" ruby -ropenssl -rjson -rbase64 -rnet/http -e '
            def b64(s) = Base64.urlsafe_encode64(s, padding: false)
            key = OpenSSL::PKey.read(File.read(ENV["KEYFILE"])); now = Time.now.to_i
            input = b64({alg: "ES256", kid: ENV["ASC_KID"], typ: "JWT"}.to_json) + "." + b64({iss: ENV["ASC_ISS"], iat: now, exp: now + 600, aud: "appstoreconnect-v1"}.to_json)
            der = key.sign(OpenSSL::Digest::SHA256.new, input)
            jwt = input + "." + b64(OpenSSL::ASN1.decode(der).value.map { |i| i.value.to_s(2).rjust(32, "\0")[-32..] }.join)
            call = lambda do |method, path, body = nil|
              uri = URI("https://api.appstoreconnect.apple.com" + path)
              req = (method == :post ? Net::HTTP::Post : method == :delete ? Net::HTTP::Delete : Net::HTTP::Get).new(uri)
              req["Authorization"] = "Bearer " + jwt; req["Content-Type"] = "application/json"
              req.body = body.to_json if body
              res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
              [res.code, (JSON.parse(res.body) rescue {})]
            end
            c, certs = call.(:get, "/v1/certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION&limit=20")
            puts "certificates GET #{c}: " + (certs["data"] || []).map { |x| "#{x["attributes"]["certificateType"]} #{x["attributes"]["displayName"]} exp #{x["attributes"]["expirationDate"].to_s[0,10]}" }.join(" | ")
            c, b = call.(:get, "/v1/bundleIds?filter[identifier]=com.mioftalmologo.FocusPocus&limit=5")
            bid = (b["data"] || []).find { |x| x["attributes"]["identifier"] == "com.mioftalmologo.FocusPocus" }
            puts "bundleId GET #{c}: #{bid ? "found" : "missing"}"
            exit 0 unless bid && certs["data"] && !certs["data"].empty?
            body = {data: {type: "profiles", attributes: {name: "Nyxian test #{now}", profileType: "IOS_APP_STORE"},
                    relationships: {bundleId: {data: {type: "bundleIds", id: bid["id"]}},
                                    certificates: {data: [{type: "certificates", id: certs["data"][0]["id"]}]}}}}
            c, r = call.(:post, "/v1/profiles", body)
            puts "profile POST #{c}: " + ((r["errors"] || []).map { |x| "#{x["code"]}: #{x["detail"]}" }.join(" | "))
            if c == "201"
              c2, _ = call.(:delete, "/v1/profiles/#{r["data"]["id"]}")
              puts "profile DELETE #{c2}"
            end
          '

      - name: Archive
        run: |
          printf '{"ok":false,"stage":"archive"}' > "$WORK/out/result.json"
          SCHEME=$(cat "$WORK/scheme.txt")
          cd "$WORK/request"
          xcodebuild -version > "$WORK/out/xcode-version.txt"
          ARGS=(-project "$SCHEME.xcodeproj" -scheme "$SCHEME" -configuration Release -destination "generic/platform=iOS" -archivePath "$WORK/App.xcarchive")
          # unsigned in both modes: signing at archive time would make Xcode create
          # iOS App Development profiles with the key, which Apple refuses
          xcodebuild archive "${ARGS[@]}" CODE_SIGNING_ALLOWED=NO >> "$WORK/out/log.txt" 2>&1
          # the archive has to hold the app's executable, or there is nothing to sign
          APP=$(ls -d "$WORK/App.xcarchive/Products/Applications/"*.app 2>/dev/null | head -1)
          EXE=$( [ -n "$APP" ] && /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" 2>/dev/null )
          if [ -z "$APP" ] || [ -z "$EXE" ] || [ ! -f "$APP/$EXE" ]; then
            echo "error: the archive has no executable: no Swift file was compiled. Check that the project's .swift files are outside Config/ and Resources/." >> "$WORK/out/log.txt"
            exit 1
          fi
          echo "SWIFT_FILES=$(grep -c '^SwiftCompile\|^CompileSwift' "$WORK/out/log.txt" || true)" >> "$GITHUB_ENV"
          if [ "$MODE" != "check" ]; then
            # the export keeps the entitlements of the archive's signature: sign
            # each extension, then the app, without a certificate, with its own
            # entitlements (the export re-signs everything for the App Store)
            for B in "$APP"/PlugIns/*.appex "$APP"/Extensions/*.appex "$APP"; do
              [ -d "$B" ] || continue
              N=$(basename "$B"); N="${N%.*}"
              ENT="$WORK/request/$N.entitlements"
              if [ -f "$ENT" ] && /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT" >/dev/null 2>&1; then
                # App Store builds carry the production push environment
                /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
              fi
              if [ -f "$ENT" ]; then
                codesign --force --sign - --entitlements "$ENT" --generate-entitlement-der "$B" >> "$WORK/out/log.txt" 2>&1
              else
                codesign --force --sign - "$B" >> "$WORK/out/log.txt" 2>&1
              fi
              echo "Signed for export: $N.$( [ "$B" = "$APP" ] && echo app || echo appex ) $( [ -f "$ENT" ] && echo "with $N.entitlements" || echo "(no entitlements)")" >> "$WORK/out/log.txt"
              codesign -d --entitlements - --xml "$B" 2>/dev/null | plutil -convert json -o - - 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print("  entitlements:", ", ".join(sorted(d)))' >> "$WORK/out/log.txt" 2>&1 || true
            done
          fi
          echo "Archived"

      - name: Sign for the App Store (API)
        if: github.event.inputs.mode != 'check'
        run: |
          printf '{"ok":false,"stage":"signing"}' > "$WORK/out/result.json"
          APP=$(ls -d "$WORK/App.xcarchive/Products/Applications/"*.app | head -1)
          BUNDLES=()
          for B in "$APP" "$APP"/PlugIns/*.appex "$APP"/Extensions/*.appex; do
            [ -d "$B" ] || continue
            BUNDLES+=("$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$B/Info.plist")")
          done
          TEAM=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("teamID") or "")' "$WORK/request/manifest.json")
          ruby nyxian/tools/fork/appstore/api_signing.rb setup "$WORK" "$TEAM" "${BUNDLES[@]}"
          # a keychain of its own with that certificate
          KC="$WORK/sign/upload.keychain-db"; KCPASS=$(openssl rand -hex 16)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          if ! security import "$WORK/sign/dist.p12" -k "$KC" -P "$(cat "$WORK/sign/dist.pass")" -T /usr/bin/codesign -T /usr/bin/xcodebuild >/dev/null 2>&1; then
            security import "$WORK/sign/dist.key" -k "$KC" -T /usr/bin/codesign -T /usr/bin/xcodebuild >/dev/null
            security import "$WORK/sign/dist.cer" -k "$KC" >/dev/null
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "KC=$KC" >> "$GITHUB_ENV"
          IDS=$(security find-identity -v -p codesigning "$KC" | grep -c "Apple Distribution" || true)
          echo "API signing: $IDS Apple Distribution identity in the keychain" >> "$WORK/out/log.txt"
          [ "$IDS" -ge 1 ] || { echo "error: the Apple Distribution certificate could not be added to the keychain" >> "$WORK/out/log.txt"; exit 1; }
          echo "Signing ready"

      - name: Upload to App Store Connect
        if: github.event.inputs.mode != 'check'
        run: |
          printf '{"ok":false,"stage":"upload"}' > "$WORK/out/result.json"
          # manual signature with the certificate and profiles of the previous step;
          # the key only authenticates the upload
          xcodebuild -exportArchive -archivePath "$WORK/App.xcarchive" -exportPath "$WORK/export" \
            -exportOptionsPlist "$WORK/sign/ExportOptions-manual.plist" \
            -authenticationKeyPath "$WORK/key/AuthKey_$ASC_KID.p8" -authenticationKeyID "$ASC_KID" -authenticationKeyIssuerID "$ASC_ISS" \
            >> "$WORK/out/log.txt" 2>&1
          echo "Uploaded"

      - name: Report (private repository)
        if: always()
        run: |
          [ -n "$WORK" ] || exit 0
          mkdir -p "$WORK/out"
          python3 - "$WORK" "$MODE" "${{ job.status }}" <<'PY'
          import json, os, plistlib, re, sys
          work, mode, status = sys.argv[1], sys.argv[2], sys.argv[3]
          out = os.path.join(work, "out")
          try:
              result = json.load(open(os.path.join(out, "result.json")))
          except Exception:
              result = {"ok": False, "stage": "start"}
          log = open(os.path.join(out, "log.txt"), errors="replace").read() if os.path.exists(os.path.join(out, "log.txt")) else ""
          ok = status == "success"
          result["ok"] = ok
          if ok:
              result["stage"] = "uploaded" if mode == "upload" else "archived"
          result["mode"] = mode
          try:
              result["xcode"] = " ".join(open(os.path.join(out, "xcode-version.txt")).read().split())
          except Exception:
              pass
          request = os.path.join(work, "request")
          for root in (os.path.join(work, "request"),):
              log = log.replace(root + "/", "")
          issues = []
          for line in log.splitlines():
              s = line.strip()
              if re.search(r"(error:|warning:|ITMS-\d+|Validation failed|Upload failed|\*\* ARCHIVE FAILED|\*\* EXPORT FAILED|Signing for .* requires|No profiles for|Provisioning profile)", s):
                  if s not in issues:
                      issues.append(s[:400])
          result["issues"] = issues[:60]
          # Xcode's own words on how it went, for Nyxian's Last Upload
          summary = []
          for line in log.splitlines():
              s = line.strip()
              if re.search(r"^\*\* (ARCHIVE|EXPORT|BUILD) (SUCCEEDED|FAILED) \*\*|^(Upload|Export) (succeeded|failed)|Uploaded package is processing", s, re.I) and s not in summary:
                  summary.append(s[:200])
          result["summary"] = summary
          info = os.path.join(work, "App.xcarchive", "Info.plist")
          if os.path.exists(info):
              a = plistlib.load(open(info, "rb")).get("ApplicationProperties", {})
              result["archived"] = {k: a.get(k) for k in ("CFBundleIdentifier", "CFBundleShortVersionString", "CFBundleVersion", "SigningIdentity", "Team")}
          json.dump(result, open(os.path.join(out, "result.json"), "w"), indent=1)
          open(os.path.join(out, "log.txt"), "w").write(log)
          PY
          case "$REQUEST" in selftest-*)
            cat "$WORK/out/result.json"; echo "Swift compile steps: $SWIFT_FILES"; grep -E '^(SwiftCompile|CompileSwift|Ld )' "$WORK/out/log.txt" | cut -c1-160 | head -20; tail -n 30 "$WORK/out/log.txt"; exit 0 ;;
          esac
          gh release view "$RELEASE" -R "$SDK_REPO" >/dev/null 2>&1 || \
            gh release create "$RELEASE" -R "$SDK_REPO" --prerelease --title "App Store requests" \
              --notes "Temporary files of Nyxian's Settings › App Store Connect › Xcode on Mac. Private." >/dev/null
          cp "$WORK/out/result.json" "$WORK/$REQUEST-result.json"
          cp "$WORK/out/log.txt" "$WORK/$REQUEST-log.txt"
          gh release upload "$RELEASE" -R "$SDK_REPO" "$WORK/$REQUEST-result.json" "$WORK/$REQUEST-log.txt" --clobber >/dev/null
          echo "Result sent to the private repository"

      - name: Clean up
        if: always()
        run: |
          case "$REQUEST" in selftest-*) ;; *) gh release delete-asset "$RELEASE" "$REQUEST.zip" -R "$SDK_REPO" -y >/dev/null 2>&1 || true ;; esac
          # the certificate and profiles made for this upload go away again
          if [ -n "$WORK" ] && [ -f "$WORK/sign/cleanup.json" ] && [ -f nyxian/tools/fork/appstore/api_signing.rb ]; then
            ruby nyxian/tools/fork/appstore/api_signing.rb cleanup "$WORK" || true
          fi
          [ -n "$KC" ] && security delete-keychain "$KC" >/dev/null 2>&1 || true
          [ -n "$WORK" ] && rm -rf "$WORK"
          echo "Cleaned"
