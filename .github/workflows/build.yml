name: Build iOS App

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest
    env:
      # fork: your PRIVATE backup repository (SDK, toolchain, Python runtime, IPAs); token: secret SDK_REPO_TOKEN
      BACKUP_REPO: ${{ vars.BACKUP_REPO || 'doctoralvarez/nyxian-sdk' }}

    steps:
      # fork: LLVM-On-iOS is now part of this repository (was a submodule of emexlab's);
      # libroot and TrollStore are not used by the build, so no submodule is fetched
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Set up Python 3.14 (fork, terminal test)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Test Python terminal (fork)
        run: python3 tools/fork/test_python_terminal.py

      - name: Test Nyxian Shell (fork)
        run: python3 tools/fork/test_python_shell.py

      - name: Test Python editor help and plots (fork)
        run: |
          python3 -m pip install --quiet jedi matplotlib pyflakes pytest
          python3 tools/fork/test_python_helpers.py

      - name: Test terminal line discipline (fork)
        run: CC=clang sh tools/fork/ldisc_test/run.sh

      - name: Test Swift formatter (fork)
        run: |
          { echo "import Foundation"; sed -n '/^\/\/ BEGIN ForkSwiftFormatter/,/^\/\/ END ForkSwiftFormatter/p' Nyxian/UI/CodeEditor/CodeEditor.swift; } > /tmp/ForkSwiftFormatter.swift
          xcrun swiftc -O -o /tmp/formatter_test tools/fork/formatter_test/main.swift /tmp/ForkSwiftFormatter.swift
          /tmp/formatter_test

      - name: Test notebook conversion (fork)
        run: |
          { echo "import Foundation"; sed -n '/^\/\/ BEGIN ForkNotebook/,/^\/\/ END ForkNotebook/p' Nyxian/UI/ContentView.swift; } > /tmp/ForkNotebook.swift
          xcrun swiftc -O -o /tmp/notebook_test tools/fork/notebook_test/main.swift /tmp/ForkNotebook.swift
          /tmp/notebook_test

      - name: Check pip finds the fork's iOS wheels (fork)
        continue-on-error: true
        run: |
          python3 -m pip download --no-deps --only-binary :all: -d /tmp/ioswheels \
            --platform ios_13_0_arm64_iphoneos --python-version 3.14 --implementation cp --abi cp314 \
            --find-links https://github.com/doctoralvarez/Nyxian/releases/expanded_assets/ios-wheels \
            --extra-index-url https://pypi.anaconda.org/beeware/simple \
            --extra-index-url https://pypi.flet.dev \
            matplotlib numpy kiwisolver contourpy pillow scipy scikit-learn pandas
          ls -la /tmp/ioswheels

      - name: Extract version
        run: |
          VERSION=$(awk -F'=' '/^[[:space:]]*VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' Config.xcconfig)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          set -e

          # Packages we desperately need
          brew install ldid dpkg libarchive

      - name: Setup
        run: |
          set -e

      # fork: cache the prebuilt Swift/LLVM/Clang toolchain (the slowest part of the build).
      # The key changes whenever the LLVM-On-iOS submodule, the Makefile or the Xcode
      # version changes, so a stale toolchain is never reused.
      - name: Compute LLVM cache key
        id: llvm-key
        run: |
          set -e
          # the commit of emexlab/LLVM-On-iOS the vendored copy comes from (same key as before)
          LLVM_SHA=$(cat tools/fork/llvm-on-ios.commit)
          XCODE_HASH=$(xcodebuild -version | shasum | cut -c1-12)
          MAKE_HASH=$(cat Makefile LLVM-On-iOS/Makefile | shasum | cut -c1-12)
          echo "key=llvm-${RUNNER_OS}-${LLVM_SHA}-${XCODE_HASH}-${MAKE_HASH}" >> "$GITHUB_OUTPUT"
          # fork: a backup built with another Xcode is good enough (same sources and Makefiles)
          echo "like=llvm-${RUNNER_OS}-${LLVM_SHA}-*-${MAKE_HASH}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Restore LLVM toolchain cache
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: Frameworks/CoreCompiler/CoreCompilerSupportLibs
          key: ${{ steps.llvm-key.outputs.key }}

      # fork: GitHub drops caches unused for 7 days; then the toolchain comes from the backup
      - name: Restore LLVM toolchain from the backup (cache miss)
        id: llvm-backup
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          ./tools/fork/backup_asset.sh restore toolchain "${{ steps.llvm-key.outputs.key }}.tar.gz" || \
            ./tools/fork/backup_asset.sh restore-like toolchain '${{ steps.llvm-key.outputs.like }}'
          test -d Frameworks/CoreCompiler/CoreCompilerSupportLibs

      - name: Build LLVM toolchain (cache miss)
        if: steps.llvm-cache.outputs.cache-hit != 'true' && steps.llvm-backup.outcome != 'success'
        timeout-minutes: 1200
        run: |
          set -e
          make Frameworks/CoreCompiler/CoreCompilerSupportLibs

      - name: Back up the LLVM toolchain (once per key)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          ./tools/fork/backup_asset.sh save toolchain "${{ steps.llvm-key.outputs.key }}.tar.gz" Frameworks/CoreCompiler/CoreCompilerSupportLibs || true

      # saved right away, so it is kept even if the app build below fails
      - name: Save LLVM toolchain cache
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Frameworks/CoreCompiler/CoreCompilerSupportLibs
          key: ${{ steps.llvm-key.outputs.key }}

      # fork: CPython for iOS, packed as Shared/python-ios.zip (cached per version)
      - name: Restore Python runtime cache
        id: python-cache
        uses: actions/cache/restore@v4
        with:
          path: Shared/python-ios.zip
          key: python-ios-3.14-b14-${{ hashFiles('tools/fork/build_python_runtime.sh', 'tools/fork/python_launcher.c') }}

      - name: Restore Python runtime from the backup (cache miss)
        id: python-backup
        if: steps.python-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          name="python-ios-3.14-b14-${{ hashFiles('tools/fork/build_python_runtime.sh', 'tools/fork/python_launcher.c') }}.zip"
          ./tools/fork/backup_asset.sh restore python-runtime "$name"
          mv "$name" Shared/python-ios.zip

      - name: Pack Python runtime (cache miss)
        if: steps.python-cache.outputs.cache-hit != 'true' && steps.python-backup.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ./tools/fork/build_python_runtime.sh

      - name: Save Python runtime cache
        if: steps.python-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Shared/python-ios.zip
          key: python-ios-3.14-b14-${{ hashFiles('tools/fork/build_python_runtime.sh', 'tools/fork/python_launcher.c') }}

      - name: Back up the Python runtime (once per version)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          ./tools/fork/backup_asset.sh save python-runtime "python-ios-3.14-b14-${{ hashFiles('tools/fork/build_python_runtime.sh', 'tools/fork/python_launcher.c') }}.zip" Shared/python-ios.zip || true

      # fork: Node.js for iOS (nodejs-mobile, no JIT), npm and the node launcher: Shared/node-ios.zip
      - name: Restore Node.js runtime cache
        id: node-cache
        uses: actions/cache/restore@v4
        with:
          path: Shared/node-ios.zip
          key: node-ios-18.20.4-${{ hashFiles('tools/fork/build_node_runtime.sh', 'tools/fork/node_launcher.c') }}

      - name: Restore Node.js runtime from the backup (cache miss)
        id: node-backup
        if: steps.node-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          name="node-ios-18.20.4-${{ hashFiles('tools/fork/build_node_runtime.sh', 'tools/fork/node_launcher.c') }}.zip"
          ./tools/fork/backup_asset.sh restore node-runtime "$name"
          mv "$name" Shared/node-ios.zip

      - name: Pack Node.js runtime (cache miss)
        if: steps.node-cache.outputs.cache-hit != 'true' && steps.node-backup.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/fork/build_node_runtime.sh

      - name: Save Node.js runtime cache
        if: steps.node-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Shared/node-ios.zip
          key: node-ios-18.20.4-${{ hashFiles('tools/fork/build_node_runtime.sh', 'tools/fork/node_launcher.c') }}

      - name: Back up the Node.js runtime (once per version)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          ./tools/fork/backup_asset.sh save node-runtime "node-ios-18.20.4-${{ hashFiles('tools/fork/build_node_runtime.sh', 'tools/fork/node_launcher.c') }}.zip" Shared/node-ios.zip || true

      # fork: the app knows the runtime by its checksum (an update with the same runtime does not unpack it again)
      - name: What's New inside the app
        run: cp CHANGELOG-FORK.md Shared/CHANGELOG-FORK.md

      - name: Checksum of the Python and Node.js runtimes
        run: |
          shasum -a 256 Shared/python-ios.zip | cut -c1-64 > Shared/python-ios.zip.sha256 && cat Shared/python-ios.zip.sha256
          shasum -a 256 Shared/node-ios.zip | cut -c1-64 > Shared/node-ios.zip.sha256 && cat Shared/node-ios.zip.sha256

      # fork: the emexLabs root CA public key goes inside the app, so a new install
      # does not need nyxian.app for it (from nyxian.app, else from the backup)
      - name: Bundle the emexLabs root CA key
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          mkdir -p Shared/Backup
          key=org.emexlabs.rootca.v1.pub.nxt2c
          if curl -fsSL --retry 3 --max-time 60 "https://nyxian.app/bootstrap/$key" -o "Shared/Backup/$key"; then
            echo "from nyxian.app: $(wc -c < Shared/Backup/$key) bytes"
            ./tools/fork/backup_asset.sh save files "$key" "Shared/Backup/$key" || true
          elif (cd Shared/Backup && ../../tools/fork/backup_asset.sh restore files "$key"); then
            echo "nyxian.app did not answer: the key comes from the backup"
          else
            rm -f "Shared/Backup/$key"
            echo "::warning::no root CA key to bundle (nyxian.app and the backup failed): new installs download it"
          fi

      - name: Build Nyxian
        timeout-minutes: 1200
        run: |
          set -e

          CHECK_DEPS=0 make all

      - name: Upload Nyxian
        uses: actions/upload-artifact@v7
        with:
          path: Nyxian.ipa
          archive: false
          retention-days: 90

      # fork: a second IPA, ONLY on the private backup, with your signing certificate inside, so a
      # reinstalled Nyxian does not ask for it (Shared/Backup/signing.p12 + signing.password). The
      # certificate and its password: signing/ in the private backup repository (the secret
      # NYXIAN_P12_PASSWORD overrides the password). The public build (the artifact above) never carries it.
      - name: Back up the IPA with your signing certificate (private)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
          P12_PASSWORD: ${{ secrets.NYXIAN_P12_PASSWORD }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "no SDK_REPO_TOKEN: no IPA with a certificate"; exit 0; }
          work=$(mktemp -d)
          gh api "repos/$BACKUP_REPO/contents/signing/nyxian-signing.p12" -H "Accept: application/vnd.github.raw" > "$work/signing.p12" \
            || { echo "no signing/nyxian-signing.p12 on $BACKUP_REPO"; exit 0; }
          [ -s "$work/signing.p12" ] || exit 0
          if [ -z "$P12_PASSWORD" ]; then
            P12_PASSWORD=$(gh api "repos/$BACKUP_REPO/contents/signing/nyxian-signing.password" -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
          fi
          mkdir -p "$work/x"
          unzip -q Nyxian.ipa -d "$work/x"
          app=$(ls -d "$work"/x/Payload/*.app | head -1)
          mkdir -p "$app/Shared/Backup"
          cp "$work/signing.p12" "$app/Shared/Backup/signing.p12"
          printf '%s' "$P12_PASSWORD" > "$app/Shared/Backup/signing.password"
          version=$(sed -n 's/^NYXIAN_FORK_VERSION *= *//p' Config.xcconfig | tr -d ' ')
          name="Nyxian-${version}-${GITHUB_SHA::7}-cert.ipa"
          (cd "$work/x" && zip -qry "$work/$name" Payload)
          ./tools/fork/backup_asset.sh save ipa "$name" "$work/$name"
          rm -rf "$work"

      # fork: every build's IPA also on the private backup (artifacts expire after 90 days)
      - name: Back up the IPA
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          version=$(sed -n 's/^NYXIAN_FORK_VERSION *= *//p' Config.xcconfig | tr -d ' ')
          ./tools/fork/backup_asset.sh save ipa "Nyxian-${version}-${GITHUB_SHA::7}.ipa" Nyxian.ipa || true
