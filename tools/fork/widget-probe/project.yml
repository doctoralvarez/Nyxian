name: WidgetProbe
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  WidgetProbe:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: WidgetProbeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mioftalmologo.WidgetProbe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
  WidgetProbeWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: WidgetProbe
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mioftalmologo.WidgetProbe.Widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
